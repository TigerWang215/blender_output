<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光学平台布局</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <h1>光学平台布局</h1>
  <span class="muted">在实验室局域网内查看布局和记录功率</span>
  <span class="spacer"></span>
  <a href="/logout" class="muted">退出登录</a>
</header>
<main>
  <div id="list" class="muted">正在加载…</div>
</main>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
fetch("/api/layouts").then(r => r.json()).then(d => {
  const box = document.getElementById("list");
  let html = "";
  for (const folder of d.folders) {  // every configured folder, in order, empty ones too
    const items = d.layouts.filter(l => l.folder === folder);
    html += `<h2 style="margin:18px 0 8px">${esc(folder)}</h2><div class="grid">`;
    if (!items.length) html += `<div class="card muted">暂无布局</div>`;
    for (const l of items) {
      const when = new Date(l.modified * 1000).toLocaleString("zh-CN", {dateStyle: "medium", timeStyle: "short"});
      html += `<a class="card layout-card" href="/layout/${l.fi}/${encodeURIComponent(l.name)}">
        <h3>${esc(l.stem)}</h3>
        <div class="muted" style="margin-bottom:6px">${esc(l.title || "")}</div>
        <span class="pill">${l.points} 个功率测量点</span>
        <span class="pill">${l.has_log ? "有功率日志" : "暂无日志"}</span>
        <div class="muted" style="font-size:12px;margin-top:6px">保存于 ${esc(when)}</div></a>`;
    }
    html += "</div>";
  }
  box.innerHTML = html;
  box.classList.remove("muted");
});
</script>
</body>
</html>
